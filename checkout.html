<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyShop - Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <a href="keranjang.html" class="back">← Kembali ke keranjang</a>
    <h2>Checkout</h2>
    <div id="checkout-summary"></div>
    <form id="checkout-form" novalidate>
      <label>Nama Lengkap
        <input type="text" id="nama" placeholder="Nama penerima">
        <small class="error" id="err-nama"></small>
      </label>
      <label>Nomor HP
        <input type="tel" id="hp" placeholder="08xxxxxxxxxx">
        <small class="error" id="err-hp"></small>
      </label>
      <label>Alamat
        <textarea id="alamat" rows="3" placeholder="Alamat lengkap"></textarea>
        <small class="error" id="err-alamat"></small>
      </label>
      <label>Metode Pembayaran
        <select id="metode">
          <option value="">-- Pilih --</option>
          <option>Transfer Bank</option>
          <option>E-Wallet</option>
          <option>COD (Bayar di Tempat)</option>
        </select>
        <small class="error" id="err-metode"></small>
      </label>
      <button type="submit" class="btn primary">Bayar Sekarang</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
